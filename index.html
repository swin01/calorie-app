<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Calorie Analyzer</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container mx-auto p-4 max-w-4xl">

    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-4xl font-bold text-gray-800">
        🍎 AI Calorie Analyzer
      </h1>

      <p class="text-gray-600 mt-2">
        Upload a food image and get AI-powered nutritional information
      </p>
    </header>


    <!-- Upload Section -->
    <div class="upload-section mb-8">

      <h2 class="text-xl font-semibold text-gray-700 mb-4">
        Upload Food Image
      </h2>

      <div class="flex flex-col gap-4 mb-4">

        <!-- File Input -->
        <input
          type="file"
          id="fileInput"
          accept="image/*"
          class="file:mr-4
                 file:py-2
                 file:px-4
                 file:rounded-full
                 file:border-0
                 file:text-sm
                 file:font-semibold
                 file:bg-blue-50
                 file:text-blue-700
                 hover:file:bg-blue-100"
        >

        <!-- Drop Zone -->
        <div
          id="dropZone"
          class="text-gray-600"
        >
          📷 Drag and drop an image here or click to select
        </div>

      </div>


      <!-- Image Preview -->
      <div
        id="preview"
        class="mb-4"
      ></div>


      <!-- Progress -->
      <div
        id="progressContainer"
        class="mb-4 hidden"
      >

        <div class="w-full bg-gray-200 rounded-full overflow-hidden">

          <div
            id="progress"
            class="h-2 bg-green-500 rounded-full"
          ></div>

        </div>

        <p class="text-sm text-gray-500 mt-2 text-center">
          Analyzing image...
        </p>

      </div>


      <!-- Analyze Button -->
      <button
        id="analyzeBtn"
        class="w-full py-3 px-4 bg-green-600 text-white rounded-full
               hover:bg-green-700 transition
               disabled:opacity-50 disabled:cursor-not-allowed"
        disabled
      >
        🔍 Analyze Food
      </button>

    </div>


    <!-- Results Section -->
    <div
      id="results"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
    ></div>


    <!-- Footer -->
    <footer class="text-center mt-10 text-gray-500 text-sm">

      <p>
        AI Calorie Analyzer
      </p>

      <p class="mt-1">
        Powered by AI
      </p>

    </footer>

  </div>


  <!-- Main JavaScript -->
  <script
    type="module"
    src="js/script.js"
  ></script>

</body>

</html>
